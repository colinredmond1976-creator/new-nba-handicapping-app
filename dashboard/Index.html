<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Handicapping Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { --bg-canvas:#060709; --bg-panel:#0C0E12; --bg-well:#040507; --bg-elevated:#13171F; --border-grid:#1C2029; --border-focus:#333B4D; --bevel-top:inset 0 1px 0 rgba(255,255,255,.05); --text-primary:#ECEFF4; --text-secondary:#8A94A6; --text-dim:#4C5566; --status-nominal:#00E5A3; --status-warning:#FFB000; --status-critical:#FF2E54; --accent-telemetry:#00B8FF; --font-display:'Space Grotesk',sans-serif; --font-mono:'IBM Plex Mono',monospace; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg-canvas); color:var(--text-primary); font:14px var(--font-display) } button,input,select { font:inherit } button { cursor:pointer } :focus-visible { outline:2px solid var(--accent-telemetry); outline-offset:2px }
    .shell { max-width:1500px; margin:auto; padding:22px 24px 40px } header { display:flex; justify-content:space-between; align-items:end; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--border-grid) } .eyebrow,.label { color:var(--text-secondary); text-transform:uppercase; letter-spacing:.1em; font:11px var(--font-mono) } h1 { font-size:25px; letter-spacing:-.03em; margin:6px 0 0 } .header-note { font:11px var(--font-mono); color:var(--text-secondary); text-align:right }
    .telemetry-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:1px; background:var(--border-grid); border:1px solid var(--border-grid) } .telemetry-panel { background:var(--bg-panel); box-shadow:var(--bevel-top); padding:12px 14px; position:relative } .telemetry-well { background:var(--bg-well); border:1px solid var(--border-grid); padding:8px 10px; font-family:var(--font-mono); font-variant-numeric:tabular-nums }
    .heartbeat { margin-top:16px; padding:15px; border-left:3px solid var(--status-nominal) } .heartbeat.warn { border-left-color:var(--status-warning) } .heartbeat.bad { border-left-color:var(--status-critical) } .status-row { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap } .badge { display:inline-block; border:1px solid currentColor; padding:3px 6px; font:600 10px var(--font-mono); color:var(--status-nominal) } .badge.void { color:var(--text-secondary) } .badge.warn { color:var(--status-warning) } .badge.bad { color:var(--status-critical) } .heartbeat-details { display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font:12px var(--font-mono); color:var(--text-secondary) }
    .summary { margin-top:12px; grid-template-columns:repeat(12,minmax(0,1fr)) } .metric { grid-column:span 3; min-width:0 } .metric:nth-child(n+5) { grid-column:span 4 } .value { margin-top:8px; font:600 22px var(--font-mono); font-variant-numeric:tabular-nums } .positive { color:var(--status-nominal) } .negative { color:var(--status-critical) }
    nav { display:flex; gap:4px; margin-top:24px; border-bottom:1px solid var(--border-grid) } nav button { border:0; border-bottom:2px solid transparent; color:var(--text-secondary); background:transparent; padding:11px 16px; font:600 12px var(--font-mono) } nav button[aria-selected="true"] { border-bottom-color:var(--accent-telemetry); color:var(--text-primary) } .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:22px 0 12px } h2 { margin:0; font-size:16px } .count { font:11px var(--font-mono); color:var(--text-secondary) }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr)); gap:12px } .game { border:1px solid var(--border-grid); background:var(--bg-panel) } .game-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px; border-bottom:1px solid var(--border-grid) } .game-title { font-size:16px; font-weight:700 } .game-date { font:11px var(--font-mono); color:var(--text-secondary) } .leg { display:grid; grid-template-columns:1fr auto; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border-grid) } .leg:last-child { border:0 } .leg-name { margin-top:5px; font-weight:600 } .leg-details { text-align:right; font:12px var(--font-mono); line-height:1.7 } .small { color:var(--text-secondary); font:11px var(--font-mono) }
    .controls { display:flex; gap:8px; flex-wrap:wrap } input,select { min-height:38px; background:var(--bg-well); color:var(--text-primary); border:1px solid var(--border-focus); padding:8px 10px; font:12px var(--font-mono) } input { min-width:240px } .table-wrap { overflow-x:auto; border:1px solid var(--border-grid) } table { width:100%; min-width:950px; border-collapse:collapse; font:12px var(--font-mono); font-variant-numeric:tabular-nums } th { text-align:left; color:var(--text-secondary); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.06em } th,td { padding:10px; border-bottom:1px solid var(--border-grid); white-space:nowrap } tr:last-child td { border-bottom:0 } .empty { color:var(--text-secondary); padding:24px 14px; font:12px var(--font-mono) } [hidden] { display:none !important }
    @media(max-width:700px) { .shell { padding:16px 12px 30px } h1 { font-size:20px } .header-note { display:none } .summary { grid-template-columns:repeat(6,minmax(0,1fr)) } .metric { grid-column:span 3 } .metric:nth-child(n+5) { grid-column:span 2 } .value { font-size:18px } .section-head { align-items:flex-start; flex-direction:column } input { min-width:0; width:100% } .controls { width:100% } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">Daily decision engine / NBA</div><h1>Handicapping Dashboard</h1></div><div class="header-note">FOUR-LEG GAME CARDS<br>DUAL-SOURCE VERIFICATION</div></header>
    <section id="heartbeat" class="telemetry-panel heartbeat" aria-live="polite"><div class="label">Run status</div><p id="loading">Loading dashboard data…</p></section>
    <section id="summary" class="telemetry-grid summary" aria-label="Performance summary"></section>
    <nav role="tablist" aria-label="Dashboard views"><button id="slate-tab" role="tab" aria-selected="true" aria-controls="slate" tabindex="0">TODAY'S SLATE</button><button id="history-tab" role="tab" aria-selected="false" aria-controls="history" tabindex="-1">HISTORY</button></nav>
    <section id="slate" role="tabpanel" aria-labelledby="slate-tab"><div class="section-head"><h2>Today's Slate</h2><span id="card-count" class="count"></span></div><div id="cards" class="cards"></div></section>
    <section id="history" role="tabpanel" aria-labelledby="history-tab" hidden><div class="section-head"><h2>Pick History</h2><div class="controls"><input id="search" type="search" placeholder="Search picks" aria-label="Search pick history"><select id="sort" aria-label="Sort pick history"><option value="newest">Date: newest first</option><option value="oldest">Date: oldest first</option><option value="matchup">Matchup</option><option value="status">Verification status</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Matchup</th><th>Market / Selection</th><th>Line</th><th>Odds</th><th>Result</th><th>Verification</th><th>Tank01</th><th>BRef</th></tr></thead><tbody id="history-body"></tbody></table></div><div id="history-empty" class="empty" hidden>No matching picks.</div></section>
  </main>
  <script>
    'use strict';
    let historyRows = [];
    const $ = id => document.getElementById(id);
    function el(tag, text, cls) { const node = document.createElement(tag); if (text != null) node.textContent = text; if (cls) node.className = cls; return node; }
    function pct(value) { return Number.isFinite(Number(value)) ? (Number(value) * 100).toFixed(1) + '%' : '—'; }
    function actual(value) { return value == null ? '—' : String(value); }
    function odds(value) { return value > 0 ? '+' + value : String(value); }
    function badge(value) { return el('span', value, 'badge' + (value === 'DISCREPANCY' || value === 'FAILED' ? ' bad' : value === 'PARTIAL' || value === 'UNVERIFIED' ? ' warn' : value === 'VOID' ? ' void' : '')); }
    function statLabel(stat) { return ({PTS:'Points', REB:'Rebounds', AST:'Assists', PRA:'Points + rebounds + assists', '3PM':'Three-pointers made', PTS_AST:'Points + assists', PTS_REB:'Points + rebounds', REB_AST:'Rebounds + assists', STL:'Steals', BLK:'Blocks', STL_BLK:'Steals + blocks'})[stat] || stat || 'Unknown stat'; }
    function selection(leg) { return leg.market_type === 'PLAYER_PROP' ? (leg.player_name || 'Unknown player') + ' · ' + statLabel(leg.stat_category) : leg.market_type.replaceAll('_', ' '); }
    function render(data) {
      const hb = data.heartbeat, banner = $('heartbeat'); banner.replaceChildren(); banner.className = 'telemetry-panel heartbeat' + (hb.status === 'FAILED' ? ' bad' : hb.status === 'PARTIAL' || hb.discrepancies_flagged ? ' warn' : '');
      const row = el('div', null, 'status-row'); row.append(el('span', 'RUN STATUS / ' + hb.run_id, 'label'), badge(hb.status)); banner.append(row);
      const details = el('div', null, 'heartbeat-details'); [new Date(hb.timestamp_utc).toLocaleString(undefined, {timeZone:'America/Toronto', timeZoneName:'short'}), hb.games_processed + ' games processed', hb.legs_graded + ' legs graded', hb.discrepancies_flagged + ' discrepancies', data._dashboard_source === 'cache' ? 'CACHED DATA' : 'LIVE DATA'].forEach(v => details.append(el('span', v))); banner.append(details); if (hb.message) banner.append(el('p', hb.message, 'small'));
      const s = data.summary, summary = $('summary'), voids = data.history.filter(leg => leg.status === 'VOID').length, openPicks = data.history.filter(leg => leg.status === 'PENDING').length, closedPicks = s.wins + s.losses + s.pushes + voids; summary.replaceChildren(); [['Open picks',openPicks],['Closed picks',closedPicks],['Wins / Losses',s.wins + ' / ' + s.losses],['Pushes / Voids',s.pushes + ' / ' + voids],['Win rate',pct(s.win_rate)],['Net units',Number(s.net_units).toFixed(2)],['ROI',Number(s.roi_pct).toFixed(1) + '%']].forEach(([label,value]) => { const panel = el('div', null, 'telemetry-panel metric'); panel.append(el('div',label,'label'),el('div',String(value),'value')); summary.append(panel); });
      $('card-count').textContent = data.todays_cards.length + ' GAMES'; const cards = $('cards'); cards.replaceChildren(); if (!data.todays_cards.length) cards.append(el('div','No cards available for this run.','empty'));
      data.todays_cards.forEach(card => { const game = el('article',null,'game'), head = el('div',null,'game-head'); head.append(el('div',card.away_team + ' @ ' + card.home_team,'game-title'),el('div',card.game_date + ' · ' + (card.game_start_time ? new Date(card.game_start_time).toLocaleTimeString('en-CA',{timeZone:'America/Toronto',hour:'numeric',minute:'2-digit',timeZoneName:'short'}) : 'Time TBD'),'game-date')); game.append(head); card.legs.forEach(leg => { const item = el('div',null,'leg'), left = el('div'), right = el('div',null,'leg-details'); left.append(el('div',leg.market_type.replaceAll('_',' '),'label'),el('div',selection(leg),'leg-name'),el('div',leg.side + ' ' + leg.line + (leg.market_type === 'PLAYER_PROP' ? ' ' + statLabel(leg.stat_category) : ''),'small')); const decimal = leg.odds_american > 0 ? 1 + leg.odds_american / 100 : 1 + 100 / Math.abs(leg.odds_american); right.append(el('div',odds(leg.odds_american)),el('div','MODEL ' + pct(leg.model_prob),'small'),el('div','EV ' + pct(leg.model_prob * decimal - 1),'small')); if (leg.status === 'VOID') right.append(badge('VOID')); item.append(left,right); game.append(item); }); cards.append(game); });
      historyRows = data.history.slice(); renderHistory();
    }
    function renderHistory() { const q = $('search').value.toLowerCase().trim(), sort = $('sort').value, rows = historyRows.filter(leg => Object.values(leg).some(v => v != null && String(v).toLowerCase().includes(q))); rows.sort((a,b) => sort === 'matchup' ? a.matchup.localeCompare(b.matchup) : sort === 'status' ? a.verification_status.localeCompare(b.verification_status) : sort === 'oldest' ? a.game_date.localeCompare(b.game_date) : b.game_date.localeCompare(a.game_date)); const body = $('history-body'); body.replaceChildren(); rows.forEach(leg => { const tr = el('tr'); [leg.game_date,leg.matchup,selection(leg) + ' · ' + leg.side,leg.line,odds(leg.odds_american)].forEach(v => tr.append(el('td',String(v)))); const result = el('td'); if (leg.status === 'VOID') result.append(badge('VOID')); else result.textContent = leg.status; tr.append(result); const cell = el('td'); cell.append(badge(leg.verification_status)); tr.append(cell,el('td',actual(leg.tank01_actual)),el('td',actual(leg.bref_actual))); body.append(tr); }); $('history-empty').hidden = rows.length > 0; }
    const tabs = [$('slate-tab'),$('history-tab')]; function activate(tab) { tabs.forEach(t => { const active = t === tab; t.setAttribute('aria-selected',String(active)); t.tabIndex = active ? 0 : -1; $(t.getAttribute('aria-controls')).hidden = !active; }); } tabs.forEach((tab,i) => { tab.addEventListener('click',() => activate(tab)); tab.addEventListener('keydown',e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const other = tabs[1-i]; activate(other); other.focus(); } }); }); $('search').addEventListener('input',renderHistory); $('sort').addEventListener('change',renderHistory);
    google.script.run.withSuccessHandler(render).withFailureHandler(error => { const banner = $('heartbeat'); banner.className = 'telemetry-panel heartbeat bad'; banner.replaceChildren(el('div','DASHBOARD UNAVAILABLE','label'),el('p',error.message || 'Unable to load data.','small')); }).getDashboardData();
  </script>
</body>
</html>
